name: Verify Worker Entry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "src/index.js"
      - "src/index-v*.js"
      - ".github/workflows/consolidate-worker.yml"

permissions:
  contents: read

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Compile current version chain
        run: npm run check

      - name: Verify production entry JavaScript
        run: node --check src/index.js

      - name: Verify Worker dry run
        run: npx wrangler deploy --dry-run
